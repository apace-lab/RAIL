[package]
name = "rail-rs"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/apace-lab/RAIL.git"

[dependencies]
llvm-ir = { version = "0.11", features = ["llvm-19"] }
petgraph = { version = "0.6.0", default-features = false, features = ["graphmap"] }
log = "0.4"
either = "1.10"
rustc-demangle = "0.1"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"